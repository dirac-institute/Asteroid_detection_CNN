[pytest]
# Run the full ADCNN unit suite from the repo root:  pytest
# Pure-function + config tests (no GPU / Butler / network). Torch-dependent tests skip if torch absent.
testpaths =
    ADCNN/pipelines/tests
    ADCNN/pipelines/heliolinc/tests
    ADCNN/evaluation/tests
    ADCNN/inference/tests
    ADCNN/calibration/tests
python_files = test_*.py
addopts = -q
